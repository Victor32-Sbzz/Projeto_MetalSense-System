services:
  # ============================================================================
  # 1. BANCO DE DADOS RELACIONAL & SÉRIES TEMPORAIS (TimescaleDB / PostgreSQL 16)
  # ============================================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: metalsense_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metalsense}
      POSTGRES_USER: ${POSTGRES_USER:-metalsense_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techforge_super_secure_db_pass_2026}
    volumes:
      - timescale_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metalsense_admin} -d ${POSTGRES_DB:-metalsense}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - metalsense_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # ============================================================================
  # 2. CACHE DISTRIBUÍDO & RATE LIMITING (Redis 7)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: metalsense_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-techforge_redis_secret_2026}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-techforge_redis_secret_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - metalsense_net

  # ============================================================================
  # 3. GATEWAY REST IOT / SERVIÇO WSGI (Gunicorn + Flask)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metalsense_api
    restart: always
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      METALSENSE_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-metalsense_admin}:${POSTGRES_PASSWORD:-techforge_super_secure_db_pass_2026}@timescaledb:5432/${POSTGRES_DB:-metalsense}
      RATELIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:-techforge_redis_secret_2026}@redis:6379/0
      METALSENSE_API_KEYS_ADMIN: ${METALSENSE_API_KEYS_ADMIN:-techforge-master-admin-key-2026}
      METALSENSE_API_KEYS_DISPOSITIVO: ${METALSENSE_API_KEYS_DISPOSITIVO:-esp32-sensor-token-prod-01,esp32-sensor-token-prod-02}
      METALSENSE_API_KEYS_LEITURA: ${METALSENSE_API_KEYS_LEITURA:-scada-monitoring-key-2026}
      GUNICORN_WORKERS: 4
      GUNICORN_THREADS: 4
      METALSENSE_LOG_LEVEL: INFO
      METALSENSE_LOG_JSON: "true"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - metalsense_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  # Frontend React servido pelo próprio serviço `api` em / (web/dist)

volumes:
  timescale_data:
    name: metalsense_timescale_volume
  redis_data:
    name: metalsense_redis_volume

networks:
  metalsense_net:
    name: metalsense_industrial_network
    driver: bridge
